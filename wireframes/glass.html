<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wireframe 02 — Glass Player</title>
<style>
  /* ---------------------------------------------------------------
     Wireframe 2: Dark glassmorphism / neon
     Blurred translucent cards over an animated gradient.
  ----------------------------------------------------------------*/
  :root {
    --neon-1: #7c4dff;
    --neon-2: #00e5ff;
    --neon-3: #ff4081;
    --glass: rgba(18, 16, 42, 0.45);
    --glass-border: rgba(255, 255, 255, 0.18);
    --text: #f5f5ff;
    --muted: rgba(245, 245, 255, 0.55);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
    font-family: "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    background: #0b0b1a;
    overflow: hidden;
  }
  /* Drifting background blobs */
  .blob {
    position: fixed;
    width: 45vmax; height: 45vmax;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.55;
    animation: drift 18s ease-in-out infinite alternate;
    z-index: 0;
  }
  .blob.a { background: var(--neon-1); top: -15vmax; left: -10vmax; }
  .blob.b { background: var(--neon-2); bottom: -18vmax; right: -8vmax; animation-delay: -6s; }
  .blob.c { background: var(--neon-3); bottom: -22vmax; left: 6vmax; animation-delay: -12s; opacity: 0.35; }
  @keyframes drift {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(8vmax, -6vmax) scale(1.25); }
  }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 380px;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 28px;
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.45);
    padding: 26px;
    animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .top .badge {
    padding: 5px 10px;
    border: 1px solid var(--glass-border);
    border-radius: 999px;
  }

  /* Spinning disc */
  .disc-wrap { display: flex; justify-content: center; margin: 26px 0 8px; }
  .disc {
    position: relative;
    width: 210px; height: 210px;
    border-radius: 50%;
    background:
      repeating-radial-gradient(circle at center,
        #16162c 0 3px, #1e1e3a 3px 6px);
    display: flex;
    align-items: center;
    justify-content: center;
    animation: spin 8s linear infinite;
    animation-play-state: paused;
    box-shadow: 0 0 0 1px var(--glass-border), 0 0 40px rgba(124, 77, 255, 0.35);
  }
  .playing .disc { animation-play-state: running; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .disc .art {
    width: 96px; height: 96px;
    border-radius: 50%;
    background: conic-gradient(from 45deg, var(--neon-1), var(--neon-2), var(--neon-3), var(--neon-1));
    box-shadow: inset 0 0 0 6px rgba(0, 0, 0, 0.5);
  }
  .disc .hole {
    position: absolute;
    width: 16px; height: 16px;
    background: #0b0b1a;
    border-radius: 50%;
    border: 1px solid var(--glass-border);
  }

  .meta { text-align: center; margin-top: 14px; }
  .meta h1 {
    font-size: 22px;
    background: linear-gradient(90deg, var(--neon-2), var(--neon-3));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .meta p { font-size: 13px; color: var(--muted); margin-top: 6px; }

  /* Progress with glowing thumb */
  .progress {
    margin-top: 20px;
    cursor: pointer;
  }
  .track {
    height: 6px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.12);
    position: relative;
  }
  .fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--neon-1), var(--neon-2));
    box-shadow: 0 0 12px var(--neon-2);
    transition: width 0.2s linear;
  }
  .fill::after {
    content: "";
    position: absolute;
    right: -7px; top: 50%;
    width: 14px; height: 14px;
    transform: translateY(-50%);
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 14px var(--neon-2);
  }
  .times {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--muted);
    margin-top: 8px;
    font-variant-numeric: tabular-nums;
  }

  /* Controls */
  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    margin-top: 18px;
  }
  .controls button {
    border: 1px solid var(--glass-border);
    background: rgba(255, 255, 255, 0.06);
    color: var(--text);
    width: 48px; height: 48px;
    border-radius: 50%;
    font-size: 15px;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.2s ease, box-shadow 0.2s ease;
  }
  .controls button:hover {
    transform: scale(1.1);
    background: rgba(255, 255, 255, 0.16);
  }
  .controls .main {
    width: 66px; height: 66px;
    font-size: 20px;
    background: linear-gradient(135deg, var(--neon-1), var(--neon-2));
    border: none;
    box-shadow: 0 0 24px rgba(124, 77, 255, 0.7);
    animation: glow 2.2s ease-in-out infinite;
  }
  @keyframes glow {
    0%, 100% { box-shadow: 0 0 18px rgba(124, 77, 255, 0.55); }
    50%      { box-shadow: 0 0 34px rgba(0, 229, 255, 0.8); }
  }
  .controls .liked { color: var(--neon-3); box-shadow: 0 0 18px var(--neon-3); }

  /* Queue */
  .queue { margin-top: 22px; border-top: 1px solid var(--glass-border); padding-top: 12px; }
  .queue h2 {
    font-size: 10px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .queue li {
    list-style: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 9px 12px;
    border-radius: 12px;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.2s ease;
  }
  .queue li:hover { background: rgba(255, 255, 255, 0.1); transform: translateX(4px); }
  .queue li.active { background: rgba(124, 77, 255, 0.35); }
  .queue li .dur { color: var(--muted); font-size: 11px; }
</style>
</head>
<body>
  <div class="blob a" aria-hidden="true"></div>
  <div class="blob b" aria-hidden="true"></div>
  <div class="blob c" aria-hidden="true"></div>

  <main class="card" id="player">
    <div class="top">
      <span class="badge" id="status">Paused</span>
      <span>Glass Player</span>
    </div>

    <div class="disc-wrap">
      <div class="disc">
        <div class="art"></div>
        <div class="hole"></div>
      </div>
    </div>

    <div class="meta">
      <h1 id="title">Neon Circuit</h1>
      <p id="artist">Volt Nights — Afterglow EP</p>
    </div>

    <div class="progress" id="progress">
      <div class="track"><div class="fill" id="fill"></div></div>
      <div class="times"><span id="cur">0:00</span><span id="dur">3:12</span></div>
    </div>

    <div class="controls">
      <button id="like" aria-label="Like">&#9825;</button>
      <button id="prev" aria-label="Previous">&#9664;&#9664;</button>
      <button class="main" id="play" aria-label="Play">&#9654;</button>
      <button id="next" aria-label="Next">&#9654;&#9654;</button>
      <button id="shuffle" aria-label="Shuffle">&#8646;</button>
    </div>

    <div class="queue">
      <h2>Up next</h2>
      <ul id="queue"></ul>
    </div>
  </main>

<script>
  // Glass player logic: playback, seek, queue selection, like/shuffle toggles.
  const tracks = [
    { title: "Neon Circuit",   artist: "Volt Nights — Afterglow EP",     dur: 192 },
    { title: "Chrome Rain",    artist: "Sable Mode — Midnight Drive",    dur: 221 },
    { title: "Photon Ballet",  artist: "Lumen Arcade — Soft Machines",   dur: 176 },
    { title: "Static Bloom",   artist: "Volt Nights — Afterglow EP",     dur: 205 },
  ];

  const player  = document.getElementById("player");
  const title   = document.getElementById("title");
  const artist  = document.getElementById("artist");
  const fill    = document.getElementById("fill");
  const curEl   = document.getElementById("cur");
  const durEl   = document.getElementById("dur");
  const playBtn = document.getElementById("play");
  const status  = document.getElementById("status");
  const queueEl = document.getElementById("queue");

  let index = 0, playing = false, elapsed = 0, liked = false, shuffle = false;

  const fmt = (s) => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");

  function renderQueue() {
    queueEl.innerHTML = "";
    tracks.forEach((t, i) => {
      const li = document.createElement("li");
      if (i === index) li.classList.add("active");
      li.innerHTML = `<span>${t.title}</span><span class="dur">${fmt(t.dur)}</span>`;
      li.addEventListener("click", () => { index = i; elapsed = 0; load(); if (!playing) togglePlay(); });
      queueEl.appendChild(li);
    });
  }

  function load() {
    const t = tracks[index];
    title.textContent = t.title;
    artist.textContent = t.artist;
    durEl.textContent = fmt(t.dur);
    renderQueue();
    update();
  }

  function update() {
    const t = tracks[index];
    fill.style.width = Math.min((elapsed / t.dur) * 100, 100) + "%";
    curEl.textContent = fmt(elapsed);
    if (elapsed >= t.dur) step(1);
  }

  function step(dir) {
    if (shuffle && dir > 0) {
      let n; do { n = Math.floor(Math.random() * tracks.length); } while (n === index && tracks.length > 1);
      index = n;
    } else {
      index = (index + dir + tracks.length) % tracks.length;
    }
    elapsed = 0;
    load();
  }

  function togglePlay() {
    playing = !playing;
    player.classList.toggle("playing", playing);
    playBtn.innerHTML = playing ? "&#10074;&#10074;" : "&#9654;";
    status.textContent = playing ? "Playing" : "Paused";
  }

  playBtn.addEventListener("click", togglePlay);
  document.getElementById("next").addEventListener("click", () => step(1));
  document.getElementById("prev").addEventListener("click", () => step(-1));
  document.getElementById("like").addEventListener("click", (e) => {
    liked = !liked;
    e.currentTarget.classList.toggle("liked", liked);
    e.currentTarget.innerHTML = liked ? "&#9829;" : "&#9825;";
  });
  document.getElementById("shuffle").addEventListener("click", (e) => {
    shuffle = !shuffle;
    e.currentTarget.classList.toggle("liked", shuffle);
  });
  document.getElementById("progress").addEventListener("click", (e) => {
    const rect = e.currentTarget.getBoundingClientRect();
    elapsed = ((e.clientX - rect.left) / rect.width) * tracks[index].dur;
    update();
  });

  // Clock: advances only while playing.
  setInterval(() => {
    if (playing) { elapsed++; update(); }
  }, 1000);

  load();
</script>
</body>
</html>
